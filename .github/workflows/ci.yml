name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Lua syntax
        run: |
          find . -name '*.lua' -print0 | while IFS= read -r -d '' f; do
            luajit -bl "$f" > /dev/null || exit 1
          done
      - name: Metadata
        run: |
          jq -e . manifest.json MortemChipX.json > /dev/null
          test "$(jq -r .version_number manifest.json)" = "$(jq -r .version MortemChipX.json)"
          test "$(file -b icon.png | cut -d, -f2 | tr -d ' ')" = "256x256"
